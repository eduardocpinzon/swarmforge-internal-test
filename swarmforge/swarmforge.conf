# Format: window-invisible <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# The optional propagation token defaults to forward-only. Use back-one or
# back-all to queue merge-only copies to earlier windows.
# Any fields after those tokens are passed to the agent CLI, e.g. --yolo.
# Grok yolo is --permission-mode bypassPermissions, added by the launcher.
window-invisible specifier codex master task forward-only --dangerously-bypass-approvals-and-sandbox
window-invisible coder codex coder task forward-only --dangerously-bypass-approvals-and-sandbox
window-invisible cleaner codex cleaner batch back-one --dangerously-bypass-approvals-and-sandbox
window-invisible architect codex architect batch back-all --dangerously-bypass-approvals-and-sandbox
window-invisible hardender codex hardender batch forward-only --dangerously-bypass-approvals-and-sandbox
window-invisible QA codex QA batch back-all --dangerously-bypass-approvals-and-sandbox
